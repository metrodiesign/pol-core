# GitLab CI/CD — corporate deploy channel (gitlab2.viriyah.co.th).
# Code of record lives on GitHub (PRs + merge gate there); this repo receives an
# automatic push mirror of develop/main/v* (see .github/workflows/mirror-gitlab.yml)
# and runs: the same Tier-1 gates, image build+push to the Container Registry, and a
# manual SSH deploy to the UAT host. No MR pipelines — reviews happen on GitHub.
#
# Runner assumption: docker executor; `package` additionally needs privileged=true for
# docker-in-docker (swap to kaniko if privileged is forbidden). Required CI/CD variables
# are listed on the jobs that use them and in docs/runbooks/deploy-self-host.md.

workflow:
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop" || $CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG =~ /^v/'

stages:
  - verify
  - test
  - package
  - deploy

verify:
  stage: verify
  image: python:3.12
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends jq nodejs
  script:
    # Guard regression tests — same Tier-1 floor as GitHub ci.yml job `verify`.
    - |
      set -euo pipefail
      shopt -s nullglob
      tests=( .claude/hooks/tests/*.test.sh )
      if [ "${#tests[@]}" -eq 0 ]; then
        echo "No guard tests found under .claude/hooks/tests/ — expected the suite." >&2
        exit 1
      fi
      status=0
      for t in "${tests[@]}"; do
        echo "=== guard-test ${t} ==="
        bash "$t" || status=1
      done
      exit "$status"
    # Full-tree secret scan; SECRET_GUARD_SKIP force-cleared so the local-only override
    # cannot neuter the CI scan.
    - SECRET_GUARD_SKIP='' .ai/bin/check-secrets.sh --all
    - scripts/check-rename-identifiers.sh
    # Task 9 cutover: same shared strict owners as GitHub verify. GitLab branch
    # pipelines use before SHA; initial push keeps zero SHA for Evidence owner.
    - EVENT_BASE_SHA="${CI_MERGE_REQUEST_DIFF_BASE_SHA:-${CI_COMMIT_BEFORE_SHA:-}}"
    - |
      set -euo pipefail
      ZERO_SHA=0000000000000000000000000000000000000000
      EVIDENCE_BASE="$EVENT_BASE_SHA"
      if [ -z "$EVENT_BASE_SHA" ]; then
        echo "RANGE_BASE_UNRESOLVED: empty provider base SHA" >&2
        exit 2
      elif [ "$EVENT_BASE_SHA" = "$ZERO_SHA" ]; then
        COMPARE_BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
      else
        git fetch --no-tags origin "$EVENT_BASE_SHA"
        COMPARE_BASE="$(git merge-base "$EVENT_BASE_SHA" HEAD)"
        EVIDENCE_BASE="$COMPARE_BASE"
      fi
      [ -n "$COMPARE_BASE" ] || { echo "CI_PROTECTED_JOB_PARSE_FAILED: no comparison base" >&2; exit 2; }
      python3 scripts/ci-workflow-preservation.py --base "$COMPARE_BASE"
      git diff --quiet "$COMPARE_BASE"..HEAD -- src tests docker pol-core.slnx Directory.Packages.props || {
        echo "protected product/runtime path changed" >&2
        exit 1
      }
      bash scripts/ci-evidence-scope.sh "$EVIDENCE_BASE" HEAD
      python3 -m unittest discover -s scripts/tests -p 'test_*.py'
      python3 scripts/spec_contract.py check --all --strict
      bash .claude/hooks/tests/repo-policy-alignment.test.sh
      bash .claude/hooks/tests/cross-harness-conformance.test.sh

dotnet:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
  cache:
    key: nuget
    paths:
      - .nuget/packages
  script:
    - dotnet restore pol-core.slnx
    - dotnet build pol-core.slnx --no-restore -warnaserror
    - dotnet test pol-core.slnx --no-build --filter "Category!=Integration"

# Optional on GitLab — GitHub's dotnet-integration job remains the merge gate.
# Needs CI/CD variable POL_SA_PASSWORD (masked). Manual + allow_failure so it never
# blocks the pipeline.
integration:
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  when: manual
  allow_failure: true
  services:
    - name: mcr.microsoft.com/mssql/server:2025-latest
      alias: sql
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $POL_SA_PASSWORD
        MSSQL_PID: Developer
    # external-sim-separate-containers: hippodb/mammothdb each get their own SQL Server service here
    # too, mirroring the local docker-compose.yml topology (hippo-db/mammoth-db) — same image/
    # variables shape as `sql` above, only the alias differs.
    - name: mcr.microsoft.com/mssql/server:2025-latest
      alias: hippo
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $POL_SA_PASSWORD
        MSSQL_PID: Developer
    - name: mcr.microsoft.com/mssql/server:2025-latest
      alias: mammoth
      variables:
        ACCEPT_EULA: "Y"
        MSSQL_SA_PASSWORD: $POL_SA_PASSWORD
        MSSQL_PID: Developer
  variables:
    NUGET_PACKAGES: $CI_PROJECT_DIR/.nuget/packages
    POL_SQL_SERVER: sql
    POL_DB: VCentralPay
    POL_HIPPO_SQL_SERVER: hippo
    POL_MAMMOTH_SQL_SERVER: mammoth
    POL_DESIGN_SQL: "Server=sql;Database=VCentralPay;User Id=sa;Password=${POL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
  cache:
    key: nuget
    paths:
      - .nuget/packages
  script:
    - |
      set -euo pipefail
      # Install go-sqlcmd (no health-cmd support on GitLab services — wait loop below).
      curl -sSL -O https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.0/sqlcmd-linux-amd64.tar.bz2
      tar xjf sqlcmd-linux-amd64.tar.bz2
      install sqlcmd /usr/local/bin/
      # Wait for all 3 SQL Server services (main + hippo + mammoth) — same bounded-retry shape per
      # alias, no GitLab health-cmd support so this loop stands in for one.
      wait_for_sql() { # $1=alias
        for i in $(seq 1 30); do
          sqlcmd -S "$1" -U sa -P "${POL_SA_PASSWORD}" -C -Q 'SELECT 1' >/dev/null 2>&1 && return 0
          [ "$i" -eq 30 ] && { echo "SQL Server ($1) never became ready" >&2; exit 1; }
          sleep 5
        done
      }
      wait_for_sql sql
      wait_for_sql hippo
      wait_for_sql mammoth
      # Ephemeral runtime principal passwords (never stored) — one per DB tier, never shared
      # (sim-db-separate-logins): pol_app on VCentralPay, hippo_app on hippodb, mammoth_app on
      # mammothdb. hex + mixed-case/digit suffix to satisfy the SQL password policy.
      export POL_APP_PASSWORD="Ci$(openssl rand -hex 8)Aa1"
      export POL_HIPPO_APP_PASSWORD="Ci$(openssl rand -hex 8)Aa1"
      export POL_MAMMOTH_APP_PASSWORD="Ci$(openssl rand -hex 8)Aa1"
      # `-b` propagates the script's own collation gate failure into the job (same reasoning as
      # the external-sim steps below).
      sqlcmd -S sql -U sa -P "${POL_SA_PASSWORD}" -C -b \
        -v DbName="VCentralPay" POL_APP_PASSWORD="${POL_APP_PASSWORD}" \
        -i docker/bootstrap/01-principals.sql
      # Simulated upstream DBs (products-sp-gateway REQ-3.2/3.3, external-sim-separate-containers):
      # hippodb/mammothdb each stand in for motordb@hippo/centerdb@mammoth on their OWN SQL Server
      # service now — each bootstrap file creates its own LOGIN too (hippo_app / mammoth_app; neither
      # service has 01-principals.sql run on it) and takes its own sqlcmd variable, so the core's
      # POL_APP_PASSWORD can never leak in. Created before any test host boots against either server so
      # parallel hosts cannot race on CREATE DATABASE; -b propagates each script's self-checks.
      sqlcmd -S hippo -U sa -P "${POL_SA_PASSWORD}" -C -b \
        -v HIPPO_APP_PASSWORD="${POL_HIPPO_APP_PASSWORD}" \
        -i docker/bootstrap/02-hippo-sim.sql
      sqlcmd -S mammoth -U sa -P "${POL_SA_PASSWORD}" -C -b \
        -v MAMMOTH_APP_PASSWORD="${POL_MAMMOTH_APP_PASSWORD}" \
        -i docker/bootstrap/03-mammoth-sim.sql
      dotnet restore pol-core.slnx
      dotnet tool install --global dotnet-ef --version 10.0.8
      export PATH="$PATH:$HOME/.dotnet/tools"
      dotnet ef database update --context PolDbContext \
        --project src/BuildingBlocks/BuildingBlocks.Infrastructure \
        --startup-project src/Hosts/Api
      ./scripts/check-migration-lineage.sh
      sqlcmd -S sql -U sa -P "${POL_SA_PASSWORD}" -C -b \
        -v DbName="${POL_DB}" \
        -i docker/bootstrap/assert-fresh-db.sql
      export POL_SA_PASSWORD
      dotnet test pol-core.slnx --filter "Category=Integration"

# Builds the same three targets as GitHub ci.yml docker-build, but pushes them to the
# GitLab Container Registry. Tag = git tag on tag pipelines, short SHA on branches
# (branches also get a moving :<branch> tag for convenience).
package:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_JOB_TOKEN" "$CI_REGISTRY"
    - |
      set -eu
      IMAGE_TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
      docker build --target final --build-arg HOST_PROJECT=src/Hosts/Api/Api.csproj --build-arg HOST_DLL=Api.dll -t "$CI_REGISTRY_IMAGE/api:$IMAGE_TAG" .
      docker build --target migrate -t "$CI_REGISTRY_IMAGE/migrate:$IMAGE_TAG" .
      for svc in api migrate; do
        docker push "$CI_REGISTRY_IMAGE/$svc:$IMAGE_TAG"
        if [ -n "${CI_COMMIT_BRANCH:-}" ]; then
          docker tag "$CI_REGISTRY_IMAGE/$svc:$IMAGE_TAG" "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_REF_SLUG"
          docker push "$CI_REGISTRY_IMAGE/$svc:$CI_COMMIT_REF_SLUG"
        fi
      done
      # Same render-validation as GitHub ci.yml: config drift between src/ and the
      # compose files fails CI instead of being found by hand. Placeholders only —
      # nothing is run.
      export MSSQL_SA_PASSWORD=ci-placeholder \
        DB_SERVER=ci-db.example.internal \
        HIPPO_DB_SERVER=ci-hippo.example.internal \
        MAMMOTH_DB_SERVER=ci-mammoth.example.internal \
        MERCHANT_USER_OIDC_CLIENT_ID=ci-placeholder \
        ADMIN_ENTRA_CLIENT_ID=ci-placeholder \
        ADMIN_ENTRA_AUTHORITY=https://login.microsoftonline.com/11111111-1111-4111-8111-111111111111/v2.0 \
        MERCHANT_USER_FRONTEND_ORIGIN=https://ci.example.com \
        ADMIN_FRONTEND_ORIGIN=https://ci-admin.example.com \
        PSP_PUBLIC_BASE_URL=https://ci-api.example.com \
        PSP_TWOCTWOP_FRONTEND_RETURN_URL=https://ci.example.com/return \
        PSP_OMISE_RETURN_URI=https://ci.example.com/return \
        REGISTRY_IMAGE="$CI_REGISTRY_IMAGE" IMAGE_TAG="$IMAGE_TAG"
      docker compose -f docker-compose.prod.yml -f docker-compose.registry.yml config -q

# Manual SSH deploys. Required CI/CD variables (protected; DEPLOY_* / SSH_* / REGISTRY_DEPLOY_*
# are ENVIRONMENT-SCOPED — same names, one value per environment `uat` / `production`):
#   SSH_PRIVATE_KEY (File), SSH_KNOWN_HOSTS (File), DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH,
#   REGISTRY_DEPLOY_USER / REGISTRY_DEPLOY_TOKEN (deploy token, read_registry — outlives
#   the job so the host can re-pull later; CI_JOB_TOKEN must NOT be used on the host).
# The host keeps its own .env + ./secrets/ per docs/runbooks/deploy-self-host.md; compose
# depends_on already enforces sql-healthy -> migrate-exit-0 -> api.
.deploy-template:
  stage: deploy
  image: alpine:3.20
  allow_failure: true # manual gate must not leave the pipeline in "blocked" state
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
  script:
    - scp docker-compose.prod.yml docker-compose.registry.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
    - |
      ssh "$DEPLOY_USER@$DEPLOY_HOST" \
        "docker login '$CI_REGISTRY' -u '$REGISTRY_DEPLOY_USER' -p '$REGISTRY_DEPLOY_TOKEN' && \
         cd '$DEPLOY_PATH' && \
         export REGISTRY_IMAGE='$CI_REGISTRY_IMAGE' IMAGE_TAG='$DEPLOY_TAG' && \
         docker compose -f docker-compose.prod.yml -f docker-compose.registry.yml pull migrate api && \
         docker compose -f docker-compose.prod.yml -f docker-compose.registry.yml up -d --no-build && \
         docker compose -f docker-compose.prod.yml -f docker-compose.registry.yml ps && \
         API_PORT=\$(grep -m1 '^API_PORT=' .env 2>/dev/null | cut -d= -f2) && \
         curl -fsS http://localhost:\${API_PORT:-5100}/health/ready"

# UAT: any develop-branch pipeline can deploy its own commit's images (:short-sha).
deploy-uat:
  extends: .deploy-template
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual
  variables:
    DEPLOY_TAG: $CI_COMMIT_SHORT_SHA
  environment:
    name: uat

# Prod: v* tags only (release rule: tag + changelog; deploy after the same build passed UAT).
deploy-prod:
  extends: .deploy-template
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: manual
  variables:
    DEPLOY_TAG: $CI_COMMIT_TAG
  environment:
    name: production
