# Self-host production profile (PLAN deploy = Docker/on-prem App tier; the DB tier is a separate,
# infra/DBA-provisioned host — see docs/runbooks/deploy-self-host.md).
#   1. copy .env.prod.example -> .env and fill the non-secret values (incl. DB_SERVER/DB_PORT)
#   2. create ./secrets/* files (see docs/runbooks/deploy-self-host.md) — they are gitignored
#   3. docker compose -f docker-compose.prod.yml up -d --build
# `migrate` bootstraps the pol_app principal + applies migrations and must finish before the hosts start.
# Ceilings (NOT in this scaffold — front it yourself): TLS termination / reverse proxy (nginx/caddy + certs),
# HA / multiple SQL replicas, a real secret manager. See the runbook.
name: pol-core

x-dotnet: &dotnet "10.0"

services:
  # rls-to-query-filter task 9 (REQ-13.4): the external tamper-resistant sink for the denial/authz telemetry
  # taxonomy. Set retention + alerting via the Seq UI/API after first boot (see the deploy runbook) — neither
  # is app-configurable, both live on the Seq side.
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: create the pol_app principal (idempotent) + apply EF migrations, then exit 0. Hosts wait for it.
  migrate:
    build:
      context: .
      target: migrate
      args:
        DOTNET_VERSION: *dotnet
    environment:
      DB_SERVER: ${DB_SERVER:?set DB_SERVER in .env}
      DB_PORT: ${DB_PORT:-1433}
      DB_CA_CERTIFICATE_FILE: ${DB_CA_CERTIFICATE_FILE:-}
      DB_NAME: ${DB_NAME:-VCentralPay}
      # external-sim-separate-containers: hippodb/mammothdb each run on their own, infra/DBA-provisioned
      # SQL Server instance — migrate bootstraps + seeds both (docker/migrate-entrypoint.sh) before the EF
      # migrations step, same as DB_SERVER above. Both required: a missing server here means the sim DB
      # never gets created/seeded, so fail fast at render time rather than partway through migrate.
      HIPPO_DB_SERVER: ${HIPPO_DB_SERVER:?set HIPPO_DB_SERVER in .env}
      HIPPO_DB_PORT: ${HIPPO_DB_PORT:-1433}
      MAMMOTH_DB_SERVER: ${MAMMOTH_DB_SERVER:?set MAMMOTH_DB_SERVER in .env}
      MAMMOTH_DB_PORT: ${MAMMOTH_DB_PORT:-1433}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      POL_APP_PASSWORD_FILE: /run/secrets/pol_app_password
    secrets: [pol_app_password, db_ca_cert]
    restart: "no"

  api:
    build:
      context: .
      target: final
      args:
        DOTNET_VERSION: *dotnet
        HOST_PROJECT: src/Hosts/Api/Api.csproj
        HOST_DLL: Api.dll
    environment:
      DB_SERVER: ${DB_SERVER:?set DB_SERVER in .env}
      DB_PORT: ${DB_PORT:-1433}
      DB_CA_CERTIFICATE_FILE: ${DB_CA_CERTIFICATE_FILE:-}
      DB_NAME: ${DB_NAME:-VCentralPay}
      DB_PRINCIPAL: pol_app
      DB_PASSWORD_FILE: /run/secrets/pol_app_password
      # external-sim-separate-containers: same sim DB tiers as `migrate` above — docker/entrypoint.sh
      # assembles SpDocument__MotorConnectionString/__NonMotorConnectionString from these (same pol_app
      # password as ConnectionStrings__App below). Both required here (compose fails fast at render time
      # if either is unset) — entrypoint.sh itself still tolerates them being unset when the image runs
      # outside this compose file (products-sp-gateway REQ-5.7: host boots either way, search 503s).
      HIPPO_DB_SERVER: ${HIPPO_DB_SERVER:?set HIPPO_DB_SERVER in .env}
      HIPPO_DB_PORT: ${HIPPO_DB_PORT:-1433}
      MAMMOTH_DB_SERVER: ${MAMMOTH_DB_SERVER:?set MAMMOTH_DB_SERVER in .env}
      MAMMOTH_DB_PORT: ${MAMMOTH_DB_PORT:-1433}
      ASPNETCORE_ENVIRONMENT: Production
      Vault__ActiveKeyId: v1
      Vault__Keys__v1__KeyFile: /run/secrets/vault_master_key
      # One API, two browser SPAs, BOTH server-side OIDC BFFs (T5 retired the Google id-token Bearer scheme
      # entirely) — each its own CONFIDENTIAL client (id + secret, the secret via a mounted file secret),
      # fully isolated scheme/cookie/callback names. CORS is split: merchant-user origin + admin origin, both
      # credentialed cookie XHR.
      MerchantAuth__Providers__Google__ClientId: ${MERCHANT_USER_OIDC_CLIENT_ID:?set MERCHANT_USER_OIDC_CLIENT_ID in .env}
      MERCHANT_USER_OIDC_CLIENT_SECRET_FILE: /run/secrets/merchant_user_oidc_client_secret
      AdminAuth__Providers__Google__ClientId: ${ADMIN_OIDC_CLIENT_ID:?set ADMIN_OIDC_CLIENT_ID in .env}
      ADMIN_OIDC_CLIENT_SECRET_FILE: /run/secrets/admin_oidc_client_secret
      # Microsoft Entra (opt-in): a blank ClientId skips the scheme, the host boots Google-only. Admin is
      # single-tenant (the boot guard rejects a multi-tenant admin Authority without AllowedTenants — pinning
      # the tenant id here satisfies it); merchant-user keeps the /organizations Authority from appsettings.json.
      # Secret files must exist even when Entra is off (empty placeholder) — same rule as db_ca_cert below.
      AdminAuth__Providers__Microsoft__ClientId: ${ADMIN_ENTRA_CLIENT_ID:-}
      AdminAuth__Providers__Microsoft__Authority: https://login.microsoftonline.com/${ADMIN_ENTRA_TENANT_ID:-REPLACE_WITH_TENANT_ID}/v2.0
      ADMIN_ENTRA_CLIENT_SECRET_FILE: /run/secrets/admin_entra_client_secret
      MerchantAuth__Providers__Microsoft__ClientId: ${MERCHANT_ENTRA_CLIENT_ID:-}
      MERCHANT_ENTRA_CLIENT_SECRET_FILE: /run/secrets/merchant_entra_client_secret
      Cors__AllowedOrigins__0: ${MERCHANT_USER_FRONTEND_ORIGIN:?set MERCHANT_USER_FRONTEND_ORIGIN in .env}
      Cors__AdminOrigins__0: ${ADMIN_FRONTEND_ORIGIN:?set ADMIN_FRONTEND_ORIGIN in .env}
      # The IdP callback lands on the API origin (provider-scoped OIDC), so post-login/error/register
      # redirects must be made absolute to each SPA's origin — same values as the CORS origins above.
      AdminSession__SpaBaseUrl: ${ADMIN_FRONTEND_ORIGIN}
      MerchantUser__Session__SpaBaseUrl: ${MERCHANT_USER_FRONTEND_ORIGIN}
      # Non-secret PSP operational config (Payments.Infrastructure/Psp/PspOptions.cs) — UseSandbox
      # defaults true (safe) so going live with real PSP credentials is an explicit .env opt-in. The
      # return URL/URI values are platform-wide redirect targets, required like the vars above: a
      # blank value boots fine but silently ships broken PSP redirects, so fail fast instead.
      # PSP_PUBLIC_BASE_URL is this API's public origin; the backend-notification URL handed to a PSP is
      # derived from it PER CONNECTION (/api/v1/webhooks/{pspConnectionId}) — it replaced the single global
      # 2C2P backend-return URL, which could only ever be right for one connection (existing deploys: see
      # docs/runbooks/deploy-self-host.md). The host also fails fast at boot when this is blank or not an
      # absolute http(s) URI, so it must be set before `up`.
      Psp__UseSandbox: ${PSP_USE_SANDBOX:-true}
      Psp__PublicBaseUrl: ${PSP_PUBLIC_BASE_URL:?set PSP_PUBLIC_BASE_URL in .env}
      Psp__TwoCTwoP__FrontendReturnUrl: ${PSP_TWOCTWOP_FRONTEND_RETURN_URL:?set PSP_TWOCTWOP_FRONTEND_RETURN_URL in .env}
      Psp__Omise__ReturnUri: ${PSP_OMISE_RETURN_URI:?set PSP_OMISE_RETURN_URI in .env}
      # REQ-13.4: not a secret (Seq ingestion is same-network only, no public exposure) — the sink degrades
      # to log-only (never blocks a request) if Seq is unreachable, so this is safe to default.
      Seq__IngestionUrl: ${SEQ_INGESTION_URL:-http://seq:80}
    secrets: [pol_app_password, vault_master_key, admin_oidc_client_secret, merchant_user_oidc_client_secret, admin_entra_client_secret, merchant_entra_client_secret, db_ca_cert]
    ports:
      # Published API port = 5100 (the Backend API port). Container speaks http on 8080 internally; HTTPS
      # (5101) is terminated by a TLS reverse proxy in front — see the runbook ceiling.
      - "${API_PORT:-5100}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  seq-data:

# File-based secrets — the files live under ./secrets/ (gitignored, chmod 600). The vault master key is the
# long-lived crypto root; the principal password gates DB access (pol_app is the sole runtime principal). The
# SA password is bootstrap-only and stays in .env. `db_ca_cert` pins the DB tier's TLS cert for `Encrypt=Strict`
# (see docker/entrypoint.sh) — if the DB tier's cert already chains to a public CA, leave DB_CA_CERTIFICATE_FILE
# unset in .env (the connection falls back to Encrypt=True;TrustServerCertificate=False) and this file can be
# an empty placeholder; compose still requires the path to exist.
secrets:
  pol_app_password:
    file: ./secrets/pol_app_password
  vault_master_key:
    file: ./secrets/vault_master_key
  admin_oidc_client_secret:
    file: ./secrets/admin_oidc_client_secret
  merchant_user_oidc_client_secret:
    file: ./secrets/merchant_user_oidc_client_secret
  admin_entra_client_secret:
    file: ./secrets/admin_entra_client_secret
  merchant_entra_client_secret:
    file: ./secrets/merchant_entra_client_secret
  db_ca_cert:
    file: ./secrets/db_ca_cert
