# Self-host production profile (PLAN deploy = Docker/on-prem, no cloud KMS).
#   1. copy .env.prod.example -> .env and fill the non-secret values
#   2. create ./secrets/* files (see docs/runbooks/deploy-self-host.md) — they are gitignored
#   3. docker compose -f docker-compose.prod.yml up -d --build
# `migrate` bootstraps the pol_app principal + applies migrations and must finish before the hosts start.
# Ceilings (NOT in this scaffold — front it yourself): TLS termination / reverse proxy (nginx/caddy + certs),
# HA / multiple SQL replicas, a real secret manager. See the runbook.
name: pol-core

x-dotnet: &dotnet "10.0"

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
      MSSQL_PID: ${MSSQL_PID:-Developer}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  # rls-to-query-filter task 9 (REQ-13.4): the external tamper-resistant sink for the denial/authz telemetry
  # taxonomy. Set retention + alerting via the Seq UI/API after first boot (see the deploy runbook) — neither
  # is app-configurable, both live on the Seq side.
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: create the pol_app principal (idempotent) + apply EF migrations, then exit 0. Hosts wait for it.
  migrate:
    build:
      context: .
      target: migrate
      args:
        DOTNET_VERSION: *dotnet
    environment:
      DB_SERVER: sql
      DB_NAME: ${DB_NAME:-VCentralPay}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      POL_APP_PASSWORD_FILE: /run/secrets/pol_app_password
    secrets: [pol_app_password]
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      target: final
      args:
        DOTNET_VERSION: *dotnet
        HOST_PROJECT: src/Hosts/Api/Api.csproj
        HOST_DLL: Api.dll
    environment:
      DB_SERVER: sql
      DB_NAME: ${DB_NAME:-VCentralPay}
      DB_PRINCIPAL: pol_app
      DB_PASSWORD_FILE: /run/secrets/pol_app_password
      ASPNETCORE_ENVIRONMENT: Production
      Vault__ActiveKeyId: v1
      Vault__Keys__v1__KeyFile: /run/secrets/vault_master_key
      # One API, two browser SPAs, BOTH server-side OIDC BFFs (T5 retired the Google id-token Bearer scheme
      # entirely) — each its own CONFIDENTIAL client (id + secret, the secret via a mounted file secret),
      # fully isolated scheme/cookie/callback names. CORS is split: merchant-user origin + admin origin, both
      # credentialed cookie XHR.
      MerchantUser__Oidc__ClientId: ${MERCHANT_USER_OIDC_CLIENT_ID:?set MERCHANT_USER_OIDC_CLIENT_ID in .env}
      MERCHANT_USER_OIDC_CLIENT_SECRET_FILE: /run/secrets/merchant_user_oidc_client_secret
      Google__Oidc__ClientId: ${ADMIN_OIDC_CLIENT_ID:?set ADMIN_OIDC_CLIENT_ID in .env}
      ADMIN_OIDC_CLIENT_SECRET_FILE: /run/secrets/admin_oidc_client_secret
      Cors__AllowedOrigins__0: ${MERCHANT_USER_FRONTEND_ORIGIN:?set MERCHANT_USER_FRONTEND_ORIGIN in .env}
      Cors__AdminOrigins__0: ${ADMIN_FRONTEND_ORIGIN:?set ADMIN_FRONTEND_ORIGIN in .env}
      # Non-secret PSP operational config (Payments.Infrastructure/Psp/PspOptions.cs) — UseSandbox
      # defaults true (safe) so going live with real PSP credentials is an explicit .env opt-in. The
      # return URL/URI values are platform-wide redirect targets, required like the vars above: a
      # blank value boots fine but silently ships broken PSP redirects, so fail fast instead.
      Psp__UseSandbox: ${PSP_USE_SANDBOX:-true}
      Psp__TwoCTwoP__FrontendReturnUrl: ${PSP_TWOCTWOP_FRONTEND_RETURN_URL:?set PSP_TWOCTWOP_FRONTEND_RETURN_URL in .env}
      Psp__TwoCTwoP__BackendReturnUrl: ${PSP_TWOCTWOP_BACKEND_RETURN_URL:?set PSP_TWOCTWOP_BACKEND_RETURN_URL in .env}
      Psp__Omise__ReturnUri: ${PSP_OMISE_RETURN_URI:?set PSP_OMISE_RETURN_URI in .env}
      # REQ-13.4: not a secret (Seq ingestion is same-network only, no public exposure) — the sink degrades
      # to log-only (never blocks a request) if Seq is unreachable, so this is safe to default.
      Seq__IngestionUrl: ${SEQ_INGESTION_URL:-http://seq:80}
    secrets: [pol_app_password, vault_master_key, admin_oidc_client_secret, merchant_user_oidc_client_secret]
    ports:
      # Published API port = 5100 (the Backend API port). Container speaks http on 8080 internally; HTTPS
      # (5101) is terminated by a TLS reverse proxy in front — see the runbook ceiling.
      - "${API_PORT:-5100}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: final
      args:
        DOTNET_VERSION: *dotnet
        HOST_PROJECT: src/Hosts/Worker/Worker.csproj
        HOST_DLL: Worker.dll
    environment:
      DB_SERVER: sql
      DB_NAME: ${DB_NAME:-VCentralPay}
      DB_PRINCIPAL: pol_app
      DB_PASSWORD_FILE: /run/secrets/pol_app_password
      ASPNETCORE_ENVIRONMENT: Production
      Vault__ActiveKeyId: v1
      Vault__Keys__v1__KeyFile: /run/secrets/vault_master_key
      Seq__IngestionUrl: ${SEQ_INGESTION_URL:-http://seq:80}
    secrets: [pol_app_password, vault_master_key]
    depends_on:
      migrate:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  sql-data:
  seq-data:

# File-based secrets — the files live under ./secrets/ (gitignored). The vault master key is the long-lived
# crypto root; the principal password gates DB access (pol_app is the sole runtime principal, shared by
# api + worker). The SA password is bootstrap-only and stays in .env.
secrets:
  pol_app_password:
    file: ./secrets/pol_app_password
  vault_master_key:
    file: ./secrets/vault_master_key
  admin_oidc_client_secret:
    file: ./secrets/admin_oidc_client_secret
  merchant_user_oidc_client_secret:
    file: ./secrets/merchant_user_oidc_client_secret
