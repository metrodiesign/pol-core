# Self-host production profile (PLAN deploy = Docker/on-prem App tier; the DB tier is a separate,
# infra/DBA-provisioned host — see docs/runbooks/deploy-self-host.md).
#   1. copy .env.prod.example -> .env and fill the non-secret values (incl. DB_SERVER/DB_PORT)
#   2. create ./secrets/* files (see docs/runbooks/deploy-self-host.md) — they are gitignored
#   3. docker compose -f docker-compose.prod.yml up -d --build
# `migrate` bootstraps the pol_app principal + applies migrations and must finish before the hosts start.
# Ceilings (NOT in this scaffold — front it yourself): TLS termination / reverse proxy (nginx/caddy + certs),
# HA / multiple SQL replicas, a real secret manager. See the runbook.
name: pol-core

x-dotnet: &dotnet "10.0"

services:
  # rls-to-query-filter task 9 (REQ-13.4): the external tamper-resistant sink for the denial/authz telemetry
  # taxonomy. Set retention + alerting via the Seq UI/API after first boot (see the deploy runbook) — neither
  # is app-configurable, both live on the Seq side.
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
    volumes:
      - seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: create the pol_app principal (idempotent) + apply EF migrations, then exit 0. Hosts wait for it.
  migrate:
    build:
      context: .
      target: migrate
      args:
        DOTNET_VERSION: *dotnet
    environment:
      DB_SERVER: ${DB_SERVER:?set DB_SERVER in .env}
      DB_PORT: ${DB_PORT:-1433}
      DB_CA_CERTIFICATE_FILE: ${DB_CA_CERTIFICATE_FILE:-}
      DB_NAME: ${DB_NAME:-VCentralPay}
      DEPLOYMENT_ENVIRONMENT: Production
      RESET_TARGET: ${RESET_TARGET:-}
      RESET_APPROVED: ${RESET_APPROVED:-false}
      BACKUP_ARTIFACT_URI: ${BACKUP_ARTIFACT_URI:-}
      BACKUP_SHA256: ${BACKUP_SHA256:-}
      RESET_APPROVAL_EVIDENCE: ${RESET_APPROVAL_EVIDENCE:-}
      ROLLBACK_EVIDENCE: ${ROLLBACK_EVIDENCE:-}
      # external-sim-separate-containers: hippodb/mammothdb each run on their own, infra/DBA-provisioned
      # SQL Server instance — migrate bootstraps + seeds both (docker/migrate-entrypoint.sh) before the EF
      # migrations step, same as DB_SERVER above. Both required: a missing server here means the sim DB
      # never gets created/seeded, so fail fast at render time rather than partway through migrate.
      HIPPO_DB_SERVER: ${HIPPO_DB_SERVER:?set HIPPO_DB_SERVER in .env}
      HIPPO_DB_PORT: ${HIPPO_DB_PORT:-1433}
      MAMMOTH_DB_SERVER: ${MAMMOTH_DB_SERVER:?set MAMMOTH_DB_SERVER in .env}
      MAMMOTH_DB_PORT: ${MAMMOTH_DB_PORT:-1433}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      POL_APP_PASSWORD_FILE: /run/secrets/pol_app_password
      # sim-db-separate-logins: each sim tier gets its OWN principal (hippo_app / mammoth_app) with its
      # own password — the bootstrap scripts take them as their own sqlcmd variables and never see
      # POL_APP_PASSWORD.
      HIPPO_APP_PASSWORD_FILE: /run/secrets/hippo_app_password
      MAMMOTH_APP_PASSWORD_FILE: /run/secrets/mammoth_app_password
    secrets: [pol_app_password, hippo_app_password, mammoth_app_password, db_ca_cert]
    restart: "no"

  api:
    build:
      context: .
      target: final
      args:
        DOTNET_VERSION: *dotnet
        HOST_PROJECT: src/Hosts/Api/Api.csproj
        HOST_DLL: Api.dll
    environment:
      DB_SERVER: ${DB_SERVER:?set DB_SERVER in .env}
      DB_PORT: ${DB_PORT:-1433}
      DB_CA_CERTIFICATE_FILE: ${DB_CA_CERTIFICATE_FILE:-}
      DB_NAME: ${DB_NAME:-VCentralPay}
      DB_PRINCIPAL: pol_app
      DB_PASSWORD_FILE: /run/secrets/pol_app_password
      # external-sim-separate-containers: same sim DB tiers as `migrate` above — docker/entrypoint.sh
      # assembles SpDocument__MotorConnectionString/__NonMotorConnectionString from these. Each sim tier
      # uses its OWN principal and password (hippo_app / mammoth_app, from the *_PASSWORD_FILE secrets
      # below) — NOT the pol_app credential ConnectionStrings__App uses (sim-db-separate-logins: an
      # upstream we do not own never shares the core's login). Both servers required here (compose fails
      # fast at render time if either is unset) — entrypoint.sh itself still tolerates them being unset
      # when the image runs outside this compose file (products-sp-gateway REQ-5.7: host boots either
      # way, search 503s).
      HIPPO_DB_SERVER: ${HIPPO_DB_SERVER:?set HIPPO_DB_SERVER in .env}
      HIPPO_DB_PORT: ${HIPPO_DB_PORT:-1433}
      HIPPO_APP_PASSWORD_FILE: /run/secrets/hippo_app_password
      MAMMOTH_DB_SERVER: ${MAMMOTH_DB_SERVER:?set MAMMOTH_DB_SERVER in .env}
      MAMMOTH_DB_PORT: ${MAMMOTH_DB_PORT:-1433}
      MAMMOTH_APP_PASSWORD_FILE: /run/secrets/mammoth_app_password
      ASPNETCORE_ENVIRONMENT: Production
      Vault__ActiveKeyId: v1
      Vault__Keys__v1__KeyFile: /run/secrets/vault_master_key
      AuditAnchor__Path: /var/lib/pol-core/audit/anchors.jsonl
      AuditAnchor__SigningKeyFile: /run/secrets/audit_anchor_signing_key
      # One API, two browser SPAs, both server-side OIDC BFFs. Microsoft is the only provider on either side;
      # each plane uses isolated confidential clients, schemes, cookies and callbacks. CORS is split by origin.
      # Admin Microsoft is required in Production. Merchant Microsoft remains opt-in. Every authority must be
      # tenant-pinned v2.0; multi-tenant Authority values fail at boot.
      AdminAuth__Providers__Microsoft__ClientId: ${ADMIN_ENTRA_CLIENT_ID:?set ADMIN_ENTRA_CLIENT_ID in .env}
      AdminAuth__Providers__Microsoft__Authority: ${ADMIN_ENTRA_AUTHORITY:?set ADMIN_ENTRA_AUTHORITY in .env}
      ADMIN_ENTRA_CLIENT_SECRET_FILE: /run/secrets/admin_entra_client_secret
      # Admin Microsoft always requires Graph User.Read employee-profile resolution.
      MerchantAuth__Providers__Microsoft__ClientId: ${MERCHANT_ENTRA_CLIENT_ID:-}
      MerchantAuth__Providers__Microsoft__Authority: ${MERCHANT_ENTRA_AUTHORITY:-}
      MERCHANT_ENTRA_CLIENT_SECRET_FILE: /run/secrets/merchant_entra_client_secret
      Cors__MerchantOrigins__0: ${MERCHANT_USER_FRONTEND_ORIGIN:?set MERCHANT_USER_FRONTEND_ORIGIN in .env}
      Cors__AdminOrigins__0: ${ADMIN_FRONTEND_ORIGIN:?set ADMIN_FRONTEND_ORIGIN in .env}
      # The IdP callback lands on the API origin (provider-scoped OIDC), so post-login/error/register
      # redirects must be made absolute to each SPA's origin — same values as the CORS origins above.
      AdminSession__WebAppBaseUrl: ${ADMIN_FRONTEND_ORIGIN}
      MerchantSession__WebAppBaseUrl: ${MERCHANT_USER_FRONTEND_ORIGIN}
      MerchantSession__DefaultReturnPath: /dashboard
      MerchantSession__ReturnUrlAllowlist__1: /dashboard
      ForwardedHeaders__KnownNetworks__0: ${FORWARDED_HEADERS_KNOWN_NETWORK:?set trusted proxy CIDR in .env}
      MerchantUser__Invitation__Smtp__Host: ${MERCHANT_INVITATION_SMTP_HOST:?set SMTP host in .env}
      MerchantUser__Invitation__Smtp__Port: ${MERCHANT_INVITATION_SMTP_PORT:-587}
      MerchantUser__Invitation__Smtp__EnableSsl: ${MERCHANT_INVITATION_SMTP_ENABLE_SSL:-true}
      MerchantUser__Invitation__Smtp__FromAddress: ${MERCHANT_INVITATION_SMTP_FROM:?set SMTP from address in .env}
      MerchantUser__Invitation__Smtp__Username: ${MERCHANT_INVITATION_SMTP_USERNAME:?set SMTP username in .env}
      MerchantUser__Invitation__Smtp__PasswordFile: /run/secrets/merchant_invitation_smtp_password
      # Non-secret PSP operational config (Payments.Infrastructure/Psp/PspOptions.cs) — UseSandbox
      # defaults true (safe) so going live with real PSP credentials is an explicit .env opt-in. The
      # return URL/URI values are platform-wide redirect targets, required like the vars above: a
      # blank value boots fine but silently ships broken PSP redirects, so fail fast instead.
      # PSP_PUBLIC_BASE_URL is this API's public origin; the backend-notification URL handed to a PSP is
      # derived from it PER CONNECTION (/api/v1/webhooks/{pspConnectionId}) — it replaced the single global
      # 2C2P backend-return URL, which could only ever be right for one connection (existing deploys: see
      # docs/runbooks/deploy-self-host.md). The host also fails fast at boot when this is blank or not an
      # absolute http(s) URI, so it must be set before `up`.
      Psp__UseSandbox: ${PSP_USE_SANDBOX:-true}
      Psp__DefaultCode: ${PSP_DEFAULT_CODE:-2c2p}
      Psp__PublicBaseUrl: ${PSP_PUBLIC_BASE_URL:?set PSP_PUBLIC_BASE_URL in .env}
      Psp__TwoCTwoP__FrontendReturnUrl: ${PSP_TWOCTWOP_FRONTEND_RETURN_URL:?set PSP_TWOCTWOP_FRONTEND_RETURN_URL in .env}
      Psp__Omise__ReturnUri: ${PSP_OMISE_RETURN_URI:?set PSP_OMISE_RETURN_URI in .env}
      # REQ-13.4: not a secret (Seq ingestion is same-network only, no public exposure) — the sink degrades
      # to log-only (never blocks a request) if Seq is unreachable, so this is safe to default.
      Seq__IngestionUrl: ${SEQ_INGESTION_URL:-http://seq:80}
    secrets: [pol_app_password, hippo_app_password, mammoth_app_password, vault_master_key, audit_anchor_signing_key, admin_entra_client_secret, merchant_entra_client_secret, merchant_invitation_smtp_password, db_ca_cert]
    # Codex review #191: without this, KYC/registration photos are written into the container's writable
    # layer (the default PhotoStoreRootPath, /app/merchant-user-photos) and are lost on every recreate —
    # this survives that for the single-host self-host target this compose file serves. A horizontally
    # scaled / multi-host deployment needs a real object-store IPhotoStore adapter instead (out of scope
    # here — a new external dependency, its own spec per this repo's spec-driven constitution).
    volumes:
      - merchant-user-photos:/app/merchant-user-photos
      - audit-anchors:/var/lib/pol-core/audit
    ports:
      # Published API port = 5100 (the Backend API port). Container speaks http on 8080 internally; HTTPS
      # (5101) is terminated by a TLS reverse proxy in front — see the runbook ceiling.
      - "${API_PORT:-5100}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      seq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  seq-data:
  merchant-user-photos:
  audit-anchors:

# File-based secrets — the files live under ./secrets/ (gitignored, chmod 600). The vault master key is the
# long-lived crypto root; the principal passwords gate DB access — one per DB tier, never shared:
# pol_app on VCentralPay, hippo_app on hippodb, mammoth_app on mammothdb (sim-db-separate-logins). The
# SA password is bootstrap-only and stays in .env. `db_ca_cert` pins the DB tier's TLS cert for `Encrypt=Strict`
# (see docker/entrypoint.sh) — if the DB tier's cert already chains to a public CA, leave DB_CA_CERTIFICATE_FILE
# unset in .env (the connection falls back to Encrypt=True;TrustServerCertificate=False) and this file can be
# an empty placeholder; compose still requires the path to exist.
secrets:
  pol_app_password:
    file: ./secrets/pol_app_password
  hippo_app_password:
    file: ./secrets/hippo_app_password
  mammoth_app_password:
    file: ./secrets/mammoth_app_password
  vault_master_key:
    file: ./secrets/vault_master_key
  audit_anchor_signing_key:
    file: ./secrets/audit_anchor_signing_key
  admin_entra_client_secret:
    file: ./secrets/admin_entra_client_secret
  merchant_entra_client_secret:
    file: ./secrets/merchant_entra_client_secret
  merchant_invitation_smtp_password:
    file: ./secrets/merchant_invitation_smtp_password
  db_ca_cert:
    file: ./secrets/db_ca_cert
