# Local dev stack: SQL Server 2025 + one-shot principal bootstrap.
# Passwords come from .env (copy .env.example). EF migrations run separately:
#   POL_DESIGN_SQL=... dotnet ef database update --context PolDbContext \
#     --project src/BuildingBlocks/BuildingBlocks.Infrastructure --startup-project src/Hosts/Api
services:
  pol-db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: pol-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - pol-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Creates the pol_app login/user, then the simulated upstream databases hippodb/mammothdb
  # (both idempotent). Exits 0 when done. The second command carries `-b` so a failed self-check
  # inside 02-external-sim.sql actually fails this container instead of passing silently.
  pol-db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    depends_on:
      pol-db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      POL_APP_PASSWORD: ${POL_APP_PASSWORD}
    volumes:
      - ./docker/bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S pol-db -U sa -P "$${MSSQL_SA_PASSWORD}" -C
        -v DbName="VCentralPay"
        POL_APP_PASSWORD="$${POL_APP_PASSWORD}"
        -i /bootstrap/01-principals.sql
        &&
        /opt/mssql-tools18/bin/sqlcmd -S pol-db -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b
        -i /bootstrap/02-external-sim.sql

  # rls-to-query-filter task 9 (REQ-13.4): the external tamper-resistant sink for the denial/authz telemetry
  # taxonomy. Local dev runs it wide open (no API key, per Seq's own quickstart) — the hosts POST structured
  # events to http://seq:5341/api/events/raw. UI/query API on the same port at http://localhost:5341.
  seq:
    image: datalust/seq:latest
    container_name: pol-seq
    environment:
      ACCEPT_EULA: "Y"
      # Local-dev only: no auth per the note above; port is loopback-bound so the
      # unauthenticated UI/API is never reachable from the LAN.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - pol-seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pol-db-data:
  pol-seq-data:
