# Local dev stack: 3 SQL Server 2025 instances (pol-db = VCentralPay, hippo-db = hippodb,
# mammoth-db = mammothdb — external-sim-separate-containers) + one-shot bootstrap for all three.
# Passwords come from .env (copy .env.example). EF migrations run separately:
#   POL_DESIGN_SQL=... dotnet ef database update --context PolDbContext \
#     --project src/BuildingBlocks/BuildingBlocks.Infrastructure --startup-project src/Hosts/Api
services:
  pol-db:
    image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
    container_name: pol-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "11433:1433"
    volumes:
      - pol-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # external-sim-separate-containers: hippodb/mammothdb each get their OWN SQL Server instance
  # (separate from pol-db/VCentralPay) — the topology products-sp-gateway always intended
  # ("separate databases on separate servers"). Ephemeral on purpose: bootstrap is idempotent and
  # seed-only, so there is nothing here worth persisting across a container recreate — no volume.
  hippo-db:
    image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
    container_name: pol-hippo-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "11434:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  mammoth-db:
    image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
    container_name: pol-mammoth-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "11435:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  # Creates the pol_app login/user on pol-db, then hippodb (own instance) and mammothdb (own
  # instance) — each bootstrap file creates its OWN login too (hippo_app / mammoth_app, each with its
  # own password, sim-db-separate-logins), since hippo-db/mammoth-db have no 01-principals.sql run on
  # them. Three separate sqlcmd variables, one per instance: POL_APP_PASSWORD never reaches the sim
  # scripts, and they in turn only accept HIPPO_APP_PASSWORD / MAMMOTH_APP_PASSWORD. All 3 idempotent.
  # Exits 0 when done. Every command carries `-b` so a failed self-check — including the collation
  # gate in 01-principals.sql — actually fails this container instead of passing silently.
  pol-db-init:
    image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
    depends_on:
      pol-db:
        condition: service_healthy
      hippo-db:
        condition: service_healthy
      mammoth-db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
      POL_APP_PASSWORD: ${POL_APP_PASSWORD}
      POL_HIPPO_APP_PASSWORD: ${POL_HIPPO_APP_PASSWORD}
      POL_MAMMOTH_APP_PASSWORD: ${POL_MAMMOTH_APP_PASSWORD}
    volumes:
      - ./docker/bootstrap:/bootstrap:ro
    entrypoint:
      - /bin/bash
      - -c
      - >
        /opt/mssql-tools18/bin/sqlcmd -S pol-db -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b
        -v DbName="VCentralPay"
        POL_APP_PASSWORD="$${POL_APP_PASSWORD}"
        -i /bootstrap/01-principals.sql
        &&
        /opt/mssql-tools18/bin/sqlcmd -S hippo-db -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b
        -v HIPPO_APP_PASSWORD="$${POL_HIPPO_APP_PASSWORD}"
        -i /bootstrap/02-hippo-sim.sql
        &&
        /opt/mssql-tools18/bin/sqlcmd -S mammoth-db -U sa -P "$${MSSQL_SA_PASSWORD}" -C -b
        -v MAMMOTH_APP_PASSWORD="$${POL_MAMMOTH_APP_PASSWORD}"
        -i /bootstrap/03-mammoth-sim.sql

  # rls-to-query-filter task 9 (REQ-13.4): the external tamper-resistant sink for the denial/authz telemetry
  # taxonomy. Local dev runs it wide open (no API key, per Seq's own quickstart) — the hosts POST structured
  # events to http://seq:5341/api/events/raw. UI/query API on the same port at http://localhost:5341.
  seq:
    image: datalust/seq:latest
    container_name: pol-seq
    environment:
      ACCEPT_EULA: "Y"
      # Local-dev only: no auth per the note above; port is loopback-bound so the
      # unauthenticated UI/API is never reachable from the LAN.
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - pol-seq-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pol-db-data:
  pol-seq-data:
