name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

# The framework is stack-agnostic: this repo ships no application code or package
# manifest, so CI exercises the framework's OWN deliverables — the guard engine
# (.ai/bin/check-*.sh) via its adversarial suite, a full-tree secret scan, and the
# REQ-coverage tracer. A downstream project that scaffolds an app adds its own
# typecheck/test steps (the task gate already auto-detects them — see .ai/bin/gate-task.sh).
jobs:
  verify:
    name: guards + spec-trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Guard regression tests
        # Tier 1 floor: the single check engine (.ai/bin/check-*.sh) is exercised by its
        # adversarial test suite here so it cannot drift / be weakened silently — a loosened
        # guard fails its own paired block/allow case and reds the build. Runs EVERY
        # *.test.sh under .claude/hooks/tests/ (destructive, hook-bypass, secrets, gate-task)
        # plus the docker entrypoint script-level suites (bugfix-sim-guardrails F10/B13/B14) —
        # entrypoint.sh and migrate-entrypoint.sh have no other CI caller, so this is the only
        # gate that reds the build when either script regresses.
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=( .claude/hooks/tests/*.test.sh docker/entrypoint.test.sh docker/migrate-entrypoint.test.sh docker/bootstrap/assert-fresh-db.test.sh scripts/check-release-evidence.test.sh )
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No guard tests found under .claude/hooks/tests/ — expected the suite." >&2
            exit 1
          fi
          status=0
          for t in "${tests[@]}"; do
            echo "::group::guard-test ${t}"
            bash "$t" || status=1
            echo "::endgroup::"
          done
          exit "$status"
      - name: Secret scan
        # Tier 1 floor: full-tree secret scan (single source: .ai/bin/check-secrets.sh).
        # --all scans the whole tree (not just a staged diff) so CI catches anything that
        # slipped past a local pre-commit hook or was committed without core.hooksPath set.
        # SECRET_GUARD_SKIP is force-cleared here so a stray env value cannot neuter the
        # CI scan (the local-only human override must not exist in the floor).
        env:
          SECRET_GUARD_SKIP: ''
        run: .ai/bin/check-secrets.sh --all
      - name: Setup Python
        # Pin the interpreter the REQ-coverage step relies on (spec_trace.py) instead of
        # whatever python3 the runner image happens to ship.
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rename identifier gate (hierarchical-naming REQ-15.3)
        # Tier 1 floor: the eight retired compound identifiers (MerchantUser, PlatformUser,
        # AdminRole, AdminPermission, PaymentSession, CartItem, Order, PspConnection)
        # must not reappear as live-code tokens in src/ or tests/. The exception list
        # (REQ-15.4) ships inside the script: retained contracts, frozen wire strings
        # (string literals stripped), history comments (stripped), L6 file-local aliases.
        run: scripts/check-rename-identifiers.sh
      - name: Spec trace (REQ coverage)
        # Tier 1 floor: every REQ in each feature's requirements.md must be referenced in
        # design.md and tasks.md. Fails the build on any uncovered REQ. Runs once per
        # feature dir under .ai/specs/ (skips dirs without a requirements.md, e.g. .gitkeep).
        run: |
          set -euo pipefail
          status=0
          for dir in .ai/specs/*/; do
            [ -f "${dir}requirements.md" ] || continue
            feature="$(basename "$dir")"
            echo "::group::spec-trace ${feature}"
            scripts/spec-trace.sh "$feature" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  dotnet:
    # The app's own gate (the framework job above noted downstream apps add this). Builds the
    # Modular Monolith with warnings-as-errors and runs the offline suite (unit + in-memory);
    # integration tests that need a live SQL Server 2025 are tagged [Trait Category=Integration]
    # and excluded here.
    name: dotnet build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore pol-core.slnx
      - name: Build (warnings as errors)
        run: dotnet build pol-core.slnx --no-restore -warnaserror
      - name: Test (unit + in-memory; integration excluded)
        run: dotnet test pol-core.slnx --no-build --filter "Category!=Integration"

  docker-build:
    # Builds the prod deploy scaffold's 2 image targets + validates docker-compose.prod.yml renders,
    # so a rename/config drift (env var renamed in src/ but not docker-compose.prod.yml — the exact
    # class of bug production-hardening PR6 fixed) fails CI instead of being found by hand. No
    # secrets needed: images are built but never run, and `config` only needs placeholder values to
    # satisfy the compose file's ${VAR:?...} required-var checks.
    name: docker build (api, migrate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target final --build-arg HOST_PROJECT=src/Hosts/Api/Api.csproj --build-arg HOST_DLL=Api.dll -t pol-core-api:ci .
      - name: Build migrate image
        run: docker build --target migrate -t pol-core-migrate:ci .
      - name: Validate docker-compose.prod.yml renders
        env:
          MSSQL_SA_PASSWORD: ci-placeholder
          DB_SERVER: ci-db.example.internal
          HIPPO_DB_SERVER: ci-hippo.example.internal
          MAMMOTH_DB_SERVER: ci-mammoth.example.internal
          MERCHANT_USER_OIDC_CLIENT_ID: ci-placeholder
          ADMIN_OIDC_CLIENT_ID: ci-placeholder
          MERCHANT_USER_FRONTEND_ORIGIN: https://ci.example.com
          ADMIN_FRONTEND_ORIGIN: https://ci-admin.example.com
          PSP_PUBLIC_BASE_URL: https://ci-api.example.com
          PSP_TWOCTWOP_FRONTEND_RETURN_URL: https://ci.example.com/return
          PSP_OMISE_RETURN_URI: https://ci.example.com/return
        run: docker compose -f docker-compose.prod.yml config

  dotnet-integration:
    # SQL contract can only be proven against a real SQL Server: spins up SQL Server 2025,
    # bootstraps DB principals, applies the fresh baseline, asserts the catalog, then
    # runs the [Trait Category=Integration] suite. Needs a repo secret MSSQL_SA_PASSWORD; the runtime
    # principal passwords are GENERATED per run (never stored). Add this to branch protection once the
    # secret is configured.
    name: dotnet integration (live SQL 2025)
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 11433:1433
        # NOTE: the `secrets` context is NOT available in services.<id>.options — only in services.<id>.env.
        # Referencing it here made the whole workflow file invalid (0 jobs, immediate failure). The SA
        # password is already in the container env above, so the health-cmd reads it as a shell var.
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
      # external-sim-separate-containers: hippodb/mammothdb each get their own SQL Server service
      # here too, mirroring the local docker-compose.yml topology (hippo-db :11434, mammoth-db :11435).
      # Same image/env/health-cmd shape as `sql` above — only the port differs.
      hippo:
        image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 11434:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
      mammoth:
        image: mcr.microsoft.com/mssql/server:2025-CU5-ubuntu-24.04@sha256:cee0f4db03b5192de777d37a22455949d1c2c230bb48c0a732b88b0933117a72
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
          MSSQL_PID: Developer
        ports:
          - 11435:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 15
    env:
      POL_SQL_SERVER: localhost,11433
      POL_DB: VCentralPay
      POL_SA_PASSWORD: ${{ secrets.MSSQL_SA_PASSWORD }}
      POL_HIPPO_SQL_SERVER: localhost,11434
      POL_MAMMOTH_SQL_SERVER: localhost,11435
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install sqlcmd
        run: |
          curl -sSL -O https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.0/sqlcmd-linux-amd64.tar.bz2
          tar xjf sqlcmd-linux-amd64.tar.bz2
          sudo install sqlcmd /usr/local/bin/
      - name: Generate ephemeral principal passwords
        # One per DB tier, never shared (sim-db-separate-logins): pol_app on VCentralPay, hippo_app on
        # hippodb, mammoth_app on mammothdb. hex (no login-name substring) + a mixed-case/digit suffix
        # -> meets SQL password policy. Exported to $GITHUB_ENV so `dotnet test` (IntegrationDb.cs) sees
        # them too.
        run: |
          echo "POL_APP_PASSWORD=Ci$(openssl rand -hex 8)Aa1" >> "$GITHUB_ENV"
          echo "POL_HIPPO_APP_PASSWORD=Ci$(openssl rand -hex 8)Aa1" >> "$GITHUB_ENV"
          echo "POL_MAMMOTH_APP_PASSWORD=Ci$(openssl rand -hex 8)Aa1" >> "$GITHUB_ENV"
      - name: Bootstrap DB principal
        # `-b` propagates the script's own collation gate failure into the job (same reasoning as
        # the external-sim step below).
        run: |
          sqlcmd -S localhost,11433 -U sa -P "${POL_SA_PASSWORD}" -C -b \
            -v DbName="VCentralPay" \
               POL_APP_PASSWORD="${POL_APP_PASSWORD}" \
            -i docker/bootstrap/01-principals.sql
      - name: Bootstrap simulated upstream DBs (products-sp-gateway REQ-3.2/3.3, external-sim-separate-containers)
        # hippodb/mammothdb each stand in for motordb@hippo/centerdb@mammoth on their OWN SQL Server
        # service now (hippo/mammoth above) — each bootstrap file creates its own LOGIN too (hippo_app /
        # mammoth_app, sim-db-separate-logins; neither service has 01-principals.sql run on it), and each
        # takes its own sqlcmd variable so the core's POL_APP_PASSWORD can never leak in. Created here,
        # BEFORE any test host boots against either server, so parallel hosts can never race on CREATE
        # DATABASE. `-b` propagates each script's own self-check failures into the job.
        run: |
          sqlcmd -S localhost,11434 -U sa -P "${POL_SA_PASSWORD}" -C -b \
            -v HIPPO_APP_PASSWORD="${POL_HIPPO_APP_PASSWORD}" \
            -i docker/bootstrap/02-hippo-sim.sql
          sqlcmd -S localhost,11435 -U sa -P "${POL_SA_PASSWORD}" -C -b \
            -v MAMMOTH_APP_PASSWORD="${POL_MAMMOTH_APP_PASSWORD}" \
            -i docker/bootstrap/03-mammoth-sim.sql
      - name: Restore
        # `dotnet ef database update` builds the startup project, which needs a restored assets file
        # (the integration job has no prior restore/build step); `dotnet test` below restores itself.
        run: dotnet restore pol-core.slnx
      - name: Apply fresh baseline migrations
        env:
          POL_DESIGN_SQL: "Server=localhost,11433;Database=VCentralPay;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True"
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.8
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet ef database update --context PolDbContext \
            --project src/BuildingBlocks/BuildingBlocks.Infrastructure \
            --startup-project src/Hosts/Api
      - name: Migration lineage gate
        # Fresh reset line is intentionally exactly InitialSchema -> SecurityObjects -> SeedData.
        env:
          POL_DESIGN_SQL: "Server=localhost,11433;Database=VCentralPay;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};Encrypt=True;TrustServerCertificate=True"
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          ./scripts/check-migration-lineage.sh
      - name: Assert fresh database contract
        # Fast catalog-level gate BEFORE the slower suite: engine/build, compatibility 170, schema,
        # native JSON, raw objects, retired-object absence, pol_app grants and seed counts. A partial
        # raw-SQL migration fails here with a precise message instead of a confusing permission-denied
        # buried in Integration.Tests output.
        run: |
          sqlcmd -S localhost,11433 -U sa -P "${POL_SA_PASSWORD}" -C -b \
            -v DbName="${POL_DB}" \
            -i docker/bootstrap/assert-fresh-db.sql
      - name: Integration tests (live SQL)
        run: dotnet test pol-core.slnx --filter "Category=Integration"
